services:
  everstory:
    build: .
    ports:
      - "8123:8123"
    environment:
      LLM_MODE: ${LLM_MODE:-stub}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://everstory:everstory@postgres:5432/everstory}
      DATABASE_AUTO_CREATE: ${DATABASE_AUTO_CREATE:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CSRF_ENFORCE: ${CSRF_ENFORCE:-true}
      AUTH_CHALLENGE_SECRET: ${AUTH_CHALLENGE_SECRET:-local-development-auth-secret-change-before-deploy}
      AUTH_EMAIL_MODE: ${AUTH_EMAIL_MODE:-development}
      AUTH_DEV_EXPOSE_CODE: ${AUTH_DEV_EXPOSE_CODE:-true}
      AUTH_REQUEST_LIMIT: ${AUTH_REQUEST_LIMIT:-5}
      AUTH_REQUEST_WINDOW_SECONDS: ${AUTH_REQUEST_WINDOW_SECONDS:-600}
      AUTH_SMTP_HOST: ${AUTH_SMTP_HOST:-}
      AUTH_SMTP_PORT: ${AUTH_SMTP_PORT:-587}
      AUTH_SMTP_USERNAME: ${AUTH_SMTP_USERNAME:-}
      AUTH_SMTP_PASSWORD: ${AUTH_SMTP_PASSWORD:-}
      AUTH_SMTP_FROM: ${AUTH_SMTP_FROM:-}
      AUTH_SMTP_TLS: ${AUTH_SMTP_TLS:-true}
      AUTH_SMTP_SSL: ${AUTH_SMTP_SSL:-false}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      INFRA_STRICT: ${INFRA_STRICT:-true}
      PLATFORM_SESSION_TOKEN_LIMIT: ${PLATFORM_SESSION_TOKEN_LIMIT:-50000}
      ARK_ENABLE_CATALOG: ${ARK_ENABLE_CATALOG:-false}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/coding/v3}
      ARK_KIMI_K27_CODE_API_KEY: ${ARK_KIMI_K27_CODE_API_KEY:-}
      ARK_DEEPSEEK_V4_PRO_API_KEY: ${ARK_DEEPSEEK_V4_PRO_API_KEY:-}
      ARK_DEEPSEEK_V4_FLASH_API_KEY: ${ARK_DEEPSEEK_V4_FLASH_API_KEY:-}
      ARK_GLM_53_API_KEY: ${ARK_GLM_53_API_KEY:-}
      ARK_MINIMAX_M3_API_KEY: ${ARK_MINIMAX_M3_API_KEY:-}
      ARK_DOUBAO_SEED_20_LITE_API_KEY: ${ARK_DOUBAO_SEED_20_LITE_API_KEY:-}
      ARK_DOUBAO_SEED_21_TURBO_API_KEY: ${ARK_DOUBAO_SEED_21_TURBO_API_KEY:-}
      LLM_STRONG_BASE_URL: ${LLM_STRONG_BASE_URL:-https://api.deepseek.com}
      LLM_STRONG_API_KEY: ${LLM_STRONG_API_KEY:-}
      LLM_STRONG_MODEL: ${LLM_STRONG_MODEL:-deepseek-chat}
      LLM_CHEAP_BASE_URL: ${LLM_CHEAP_BASE_URL:-https://api.deepseek.com}
      LLM_CHEAP_API_KEY: ${LLM_CHEAP_API_KEY:-}
      LLM_CHEAP_MODEL: ${LLM_CHEAP_MODEL:-deepseek-chat}
    volumes:
      - everstory_saves:/app/saves
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: everstory
      POSTGRES_USER: everstory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-everstory}
    volumes:
      - everstory_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everstory -d everstory"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - everstory_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  everstory_saves:
  everstory_postgres:
  everstory_redis:
