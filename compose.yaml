services:
  everstory:
    build: .
    ports:
      - "8123:8123"
    environment:
      LLM_MODE: ${LLM_MODE:-stub}
      PLATFORM_SESSION_TOKEN_LIMIT: ${PLATFORM_SESSION_TOKEN_LIMIT:-50000}
      ARK_ENABLE_CATALOG: ${ARK_ENABLE_CATALOG:-false}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/coding/v3}
      ARK_KIMI_K27_CODE_API_KEY: ${ARK_KIMI_K27_CODE_API_KEY:-}
      ARK_DEEPSEEK_V4_PRO_API_KEY: ${ARK_DEEPSEEK_V4_PRO_API_KEY:-}
      ARK_DEEPSEEK_V4_FLASH_API_KEY: ${ARK_DEEPSEEK_V4_FLASH_API_KEY:-}
      ARK_GLM_53_API_KEY: ${ARK_GLM_53_API_KEY:-}
      ARK_MINIMAX_M3_API_KEY: ${ARK_MINIMAX_M3_API_KEY:-}
      ARK_DOUBAO_SEED_20_LITE_API_KEY: ${ARK_DOUBAO_SEED_20_LITE_API_KEY:-}
      ARK_DOUBAO_SEED_21_TURBO_API_KEY: ${ARK_DOUBAO_SEED_21_TURBO_API_KEY:-}
      LLM_STRONG_BASE_URL: ${LLM_STRONG_BASE_URL:-https://api.deepseek.com}
      LLM_STRONG_API_KEY: ${LLM_STRONG_API_KEY:-}
      LLM_STRONG_MODEL: ${LLM_STRONG_MODEL:-deepseek-chat}
      LLM_CHEAP_BASE_URL: ${LLM_CHEAP_BASE_URL:-https://api.deepseek.com}
      LLM_CHEAP_API_KEY: ${LLM_CHEAP_API_KEY:-}
      LLM_CHEAP_MODEL: ${LLM_CHEAP_MODEL:-deepseek-chat}
    volumes:
      - everstory_saves:/app/saves
    restart: unless-stopped

volumes:
  everstory_saves:
