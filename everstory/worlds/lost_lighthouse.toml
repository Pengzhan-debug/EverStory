title = "The Lost Lighthouse"
time = 0
turn = 0

[flags]
lighthouse_lit = false
case_solved = false

[[entities]]
id = "player"
kind = "character"
name = "You"
is_player = true
description = "A castaway who washed up on Saltrock Island."
location = "storm_shore"

[[entities]]
id = "mara"
kind = "character"
name = "Mara"
description = "The old lighthouse keeper. She knows what happened to the previous keeper."
location = "lighthouse_ground"

[entities.attributes]
gift_effect = { oil_can = "gave_oil" }
talk_flag = "interviewed_mara"
persona = "The old lighthouse keeper, in her sixties, with salt-stained hands and a voice roughened by sea wind. Wary of strangers at first; speaks in short, plain sentences. She is haunted by the previous keeper's disappearance a year ago and will not speak of it freely until she trusts you. Once trusted, she shares what the logbook says: the lamp was sabotaged, and she suspects the old keeper still walks the cliffs at night. She can describe the island, the cottage, the dock and the sea cave from years of living here."

[entities.attributes.dialogue]
default = "The keeper eyes you wearily. \"The light has been out for a year, and the sea has grown restless.\""
gave_oil = "She accepts the oil can with trembling hands. \"You'd make a fine keeper... The last one disappeared the night the light failed. His logbook says the lamp was sabotaged.\""
learned_secret = "\"Some say the old keeper still walks the cliffs at night. Finish what he started — light the lamp.\""

[[entities]]
id = "elias"
kind = "character"
name = "Elias Ward"
description = "The island's harbormaster and salvage broker. His neat coat cannot hide tar beneath his fingernails."
location = "dock"

[entities.attributes]
talk_flag = "interviewed_elias"
culprit = true
accusation_requires = ["found_cut_line", "found_salvage_ledger", "verified_tide_timeline", "interviewed_elias", "interviewed_mara", "interviewed_celia"]
confession = "Faced with the cut fuel line, the salvage ledger, Celia's tide timeline, and all three testimonies, Elias Ward breaks. He extinguished the lighthouse to drive a cargo ship onto Saltrock reef, then hid the wreck's cargo through his salvage office. The sabotage case is solved."
persona = "Saltrock's controlled, defensive harbormaster. He denies entering the lighthouse and insists every salvaged crate was legally abandoned. When challenged, he focuses on procedure and avoids the night the lamp failed."

[entities.attributes.dialogue]
default = "Elias straightens his cuffs. \"I never entered that lighthouse. The lamp failed in the storm, and every crate I recovered was lawful salvage.\""

[[entities]]
id = "celia"
kind = "character"
name = "Dr. Celia Thorne"
description = "A coastal researcher stranded by the storm. Her tide records make her a witness—and an early suspect."
location = "cottage"

[entities.attributes]
talk_flag = "interviewed_celia"
persona = "A precise coastal researcher who records times, tides, and weather obsessively. She is impatient with folklore and points investigators toward physical evidence."

[entities.attributes.dialogue]
default = "Celia taps her tide chart. \"The storm arrived after midnight. The lighthouse fuel line was already failing before the first squall—and I saw Elias's launch leave the dock at eleven.\""

[[entities]]
id = "storm_shore"
kind = "location"
name = "Storm Shore"
description = "Rain lashes a black-stone beach where the sea has just thrown you ashore. Above the cliffs, a dead lighthouse cuts through the lightning; three paths lead toward shelter, the dock, and the tower."
attributes = { connections = ["cottage", "dock", "lighthouse_ground"] }

[[entities]]
id = "lighthouse_ground"
kind = "location"
name = "Lighthouse Ground Floor"
description = "A damp stone room. A spiral staircase climbs into the tower, and a logbook lies on a table."
attributes = { connections = ["lighthouse_tower", "cottage", "cliff_path", "storm_shore"] }

[[entities]]
id = "lighthouse_tower"
kind = "location"
name = "Lighthouse Tower"
description = "A narrow stairwell spiralling up to the lantern room."
attributes = { connections = ["lighthouse_ground", "lantern_room"] }

[[entities]]
id = "lantern_room"
kind = "location"
name = "Lantern Room"
description = "The glass-walled top of the lighthouse. The great lantern sits dark and empty."
attributes = { connections = ["lighthouse_tower"] }

[[entities]]
id = "cottage"
kind = "location"
name = "Keeper's Cottage"
description = "A tidy cottage with a cold fireplace. A lantern hangs by the door."
attributes = { connections = ["lighthouse_ground", "dock", "storm_shore"] }

[[entities]]
id = "dock"
kind = "location"
name = "Dock"
description = "A rotting wooden dock. A rowboat rocks in the surf."
attributes = { connections = ["cottage", "boat_shed", "storm_shore"] }

[[entities]]
id = "boat_shed"
kind = "location"
name = "Boat Shed"
description = "A shack smelling of tar and salt. An oil can sits on a shelf."
attributes = { connections = ["dock"] }

[[entities]]
id = "cliff_path"
kind = "location"
name = "Cliff Path"
description = "A narrow path along the cliffs, leading down to a sea cave."
attributes = { connections = ["lighthouse_ground", "cave"] }

[[entities]]
id = "cave"
kind = "location"
name = "Sea Cave"
description = "A cold cave that fills with spray at high tide. Something glints in the sand."
attributes = { connections = ["cliff_path"] }

[[entities]]
id = "rusty_key"
kind = "item"
name = "rusty key"
description = "A corroded brass key."
location = "cave"

[[entities]]
id = "oil_can"
kind = "item"
name = "oil can"
description = "A can of lamp oil."
location = "boat_shed"

[[entities]]
