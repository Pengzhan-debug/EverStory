[[entities]]
id = "salvage_ledger"
kind = "item"
name = "salvage ledger"
description = "A private cargo ledger hidden behind the boat-shed oil shelf."
location = "boat_shed"
attributes = { examine_flag = "found_salvage_ledger", examine_text = "The final page lists cargo from the wreck before the lighthouse failed. The entries are initialed E.W., and one margin note reads: lamp dark by eleven." }

[[entities]]
id = "tide_chart"
kind = "item"
name = "annotated tide chart"
description = "Celia's hourly tide observations, written in several inks."
location = "cottage"
attributes = { examine_flag = "verified_tide_timeline", examine_text = "The continuous measurements corroborate Celia's timeline: the wind strengthened only after the light had already gone dark." }

