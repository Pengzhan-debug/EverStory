[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everstory"
version = "0.1.0"
description = "State-consistent persistent AI world engine: LLM proposes, state machine decides."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EverStory contributors" }]

[project.scripts]
everstory = "everstory.cli:main"
everstory-serve = "everstory.api.main:run"
everstory-eval = "everstory.eval.__main__:main"

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "requests>=2.31", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["everstory*"]
