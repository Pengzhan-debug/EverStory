[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everstory"
version = "1.4.0"
description = "State-consistent persistent AI world engine: LLM proposes, state machine decides."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EverStory contributors" }]

[project.scripts]
everstory = "everstory.cli:main"
everstory-serve = "everstory.api.main:run"
everstory-eval = "everstory.eval.__main__:main"
everstory-learn = "everstory.learn.__main__:main"

[project.optional-dependencies]
web = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "requests>=2.31",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "redis>=5.0",
  "cryptography>=43,<46",
]
production = ["psycopg[binary]>=3.2", "alembic>=1.13"]

[tool.setuptools.packages.find]
include = ["everstory*"]
