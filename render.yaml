services:
  - type: web
    name: everstory
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    dockerCommand: /bin/sh -c "python -m alembic upgrade head && exec python -m uvicorn everstory.api.main:app --host 0.0.0.0 --port 8123"
    envVars:
      - key: LLM_MODE
        value: stub
      - key: DATABASE_URL
        fromDatabase:
          name: everstory-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: everstory-key-value
          property: connectionString
      - key: DATABASE_AUTO_CREATE
        value: false
      - key: RATE_LIMIT_REQUESTS
        value: 60
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: COOKIE_SECURE
        value: true
      - key: CSRF_ENFORCE
        value: true
      - key: AUTH_CHALLENGE_SECRET
        generateValue: true
      - key: BYOK_MASTER_KEY
        generateValue: true
      - key: BYOK_MASTER_KEY_ID
        value: render-v1
      - key: BYOK_PREVIOUS_MASTER_KEYS
        value: "{}"
      - key: AUTH_EMAIL_MODE
        value: disabled
      - key: AUTH_DEV_EXPOSE_CODE
        value: false
      - key: AUTH_REQUEST_LIMIT
        value: 5
      - key: AUTH_REQUEST_WINDOW_SECONDS
        value: 600
      - key: PLATFORM_SESSION_TOKEN_LIMIT
        value: 50000
      - key: ARK_ENABLE_CATALOG
        value: false
      - key: ARK_KIMI_K27_CODE_API_KEY
        sync: false
      - key: ARK_DEEPSEEK_V4_PRO_API_KEY
        sync: false
      - key: ARK_DEEPSEEK_V4_FLASH_API_KEY
        sync: false
      - key: ARK_GLM_53_API_KEY
        sync: false
      - key: ARK_MINIMAX_M3_API_KEY
        sync: false
      - key: ARK_DOUBAO_SEED_20_LITE_API_KEY
        sync: false
      - key: ARK_DOUBAO_SEED_21_TURBO_API_KEY
        sync: false

  - type: keyvalue
    name: everstory-key-value
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: everstory-postgres
    plan: free
    databaseName: everstory
    user: everstory
    ipAllowList: []
