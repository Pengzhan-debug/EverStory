services:
  - type: web
    name: everstory
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_MODE
        value: stub
      # Attach managed PostgreSQL/Key Value URLs here when moving beyond the
      # free single-instance portfolio demo. Empty values keep file mode.
      - key: DATABASE_URL
        value: ""
      - key: REDIS_URL
        value: ""
      - key: DATABASE_AUTO_CREATE
        value: true
      - key: RATE_LIMIT_REQUESTS
        value: 60
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: COOKIE_SECURE
        value: true
      - key: CSRF_ENFORCE
        value: true
      - key: AUTH_CHALLENGE_SECRET
        generateValue: true
      - key: AUTH_EMAIL_MODE
        value: disabled
      - key: AUTH_DEV_EXPOSE_CODE
        value: false
      - key: AUTH_REQUEST_LIMIT
        value: 5
      - key: AUTH_REQUEST_WINDOW_SECONDS
        value: 600
      - key: PLATFORM_SESSION_TOKEN_LIMIT
        value: 50000
      - key: ARK_ENABLE_CATALOG
        value: false
      - key: ARK_KIMI_K27_CODE_API_KEY
        sync: false
      - key: ARK_DEEPSEEK_V4_PRO_API_KEY
        sync: false
      - key: ARK_DEEPSEEK_V4_FLASH_API_KEY
        sync: false
      - key: ARK_GLM_53_API_KEY
        sync: false
      - key: ARK_MINIMAX_M3_API_KEY
        sync: false
      - key: ARK_DOUBAO_SEED_20_LITE_API_KEY
        sync: false
      - key: ARK_DOUBAO_SEED_21_TURBO_API_KEY
        sync: false
