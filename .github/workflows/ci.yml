name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[web,production]"
      - name: Run offline deterministic test suite
        env:
          LLM_MODE: stub
        run: python -m unittest discover -s tests -v
      - name: Verify multi-agent investigation benchmark
        if: matrix.python-version == '3.12'
        run: python -m everstory.eval --mode stub --team-only --out /tmp/everstory-team-eval.md
